name: Build Android APK

on:
  push:
    branches: [master, main, app]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'capacitor.config.json'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -PversionCode="${GITHUB_RUN_NUMBER}" \
            -PversionName="1.0.${GITHUB_RUN_NUMBER}"

      - name: Name update APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/cs-mahjong.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cs-mahjong-debug-apk
          path: build-output/cs-mahjong.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish latest APK release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: 长沙麻将 Android ${{ github.run_number }}
          body: |
            自动构建的长沙麻将 APK。
            versionCode: ${{ github.run_number }}
            提交: ${{ github.sha }}
          files: build-output/cs-mahjong.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
